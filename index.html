<style>
/* Layout: one calm column, document-style; results as a small bento grid */
:root{
  --bg:#F7F6F3;--card:#FFFFFF;--line:#EAEAEA;--ink:#2F3437;--ink-strong:#111111;--muted:#787774;
  --green-bg:#EDF3EC;--green:#346538;--red-bg:#FDEBEC;--red:#9F2F2D;--yellow-bg:#FBF3DB;--yellow:#956400;--blue-bg:#E1F3FE;--blue:#1F6C9F;
  --sans:-apple-system,'SF Pro Display','Helvetica Neue','Segoe UI Variable Display','Segoe UI','Noto Sans',sans-serif;
  --serif:'New York','Iowan Old Style','Palatino Linotype',Georgia,'Noto Serif',serif;
  --mono:'SF Mono','Cascadia Mono',Consolas,monospace;
  --r:12px;--r-sm:6px;--t:.2s;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 80% -10%,rgba(214,180,140,.12),transparent 70%)}
main{max-width:880px;margin:0 auto;padding-block:64px calc(96px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));position:relative}
header{display:flex;align-items:center;gap:12px;margin-bottom:48px}
header img{width:40px;height:40px;border-radius:10px}
.brand{flex:1;min-width:0}
.lang{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding-inline:12px 4px;min-height:44px}
.lang svg{flex:none}
.lang select{font:500 14px var(--sans);color:var(--ink-strong);background:transparent;border:0;min-height:42px;padding-inline:4px 8px;cursor:pointer;max-width:160px}
.lang:focus-within{outline:2px solid var(--ink-strong);outline-offset:2px}
.lang select:focus{outline:none}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:400 56px/1.1 var(--serif);letter-spacing:-.03em;color:var(--ink-strong);margin-bottom:12px;text-wrap:balance}
:lang(ar) h1,:lang(zh) h1,:lang(ja) h1,:lang(ko) h1,:lang(hi) h1{letter-spacing:0;font-family:var(--sans);font-weight:600;line-height:1.25}
:lang(ar) .eyebrow,:lang(zh) .eyebrow,:lang(ja) .eyebrow,:lang(ko) .eyebrow,:lang(hi) .eyebrow{letter-spacing:0;font-family:var(--sans)}
.lead{color:var(--muted);max-width:560px;margin-bottom:32px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:14px;counter-increment:s}
.step::before{content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font:500 12px var(--mono);margin-bottom:8px}
.step b{display:block;color:var(--ink-strong)}
.step span{color:var(--muted);font-size:13px}
.drop{display:block;border:1px dashed #D6D4CE;border-radius:var(--r);background:var(--card);padding:48px 32px;text-align:center;cursor:pointer;transition:background var(--t),border-color var(--t)}
.drop:hover,.drop.over{background:#FBFBFA;border-color:#B9B6AE}
.drop:focus-within{outline:2px solid var(--ink-strong);outline-offset:2px}
.drop strong{display:block;color:var(--ink-strong);font-weight:600;margin:12px 0 4px}
.drop span{color:var(--muted);font-size:13px}
.drop.busy{opacity:.6;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font:500 14px var(--sans);background:var(--ink-strong);color:#fff;border:0;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;text-decoration:none;transition:background var(--t),transform .1s}
.btn:hover{background:#333}.btn:active{transform:scale(.98)}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink-strong);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#fff}
.btn.small{min-height:36px;padding:4px 12px;font-size:12px}
.msg{margin-top:16px;font-size:14px;min-height:24px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:box-shadow var(--t);min-width:0}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span6{grid-column:span 6}
.num{font:400 44px/1 var(--serif);letter-spacing:-.02em;color:var(--ink-strong);margin-top:8px;font-variant-numeric:tabular-nums}
.delta{font:500 12px var(--mono);margin-top:8px;color:var(--muted)}
.tag{display:inline-block;font:600 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:9999px}
.t-green{background:var(--green-bg);color:var(--green)}.t-red{background:var(--red-bg);color:var(--red)}.t-yellow{background:var(--yellow-bg);color:var(--yellow)}.t-blue{background:var(--blue-bg);color:var(--blue)}
.list{list-style:none;padding:0;margin-top:16px;max-height:340px;overflow:auto}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list a{color:var(--ink-strong);text-decoration:none;font-family:var(--mono);font-size:13px;padding:8px 0;direction:ltr;unicode-bidi:isolate}
.list a:hover{text-decoration:underline}
.empty{color:var(--muted)}
.search{width:100%;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink-strong);font:inherit;font-size:16px}
.search:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.qres{margin-top:12px;min-height:24px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:600 13px/1 var(--mono);text-transform:uppercase;background:hsl(var(--h) 45% 88%);color:hsl(var(--h) 45% 28%)}
.list li .who{display:flex;align-items:center;gap:12px;min-width:0}
.list li.more{justify-content:center;border-bottom:0}
h2{font:400 32px/1.1 var(--serif);letter-spacing:-.02em;color:var(--ink-strong);margin:64px 0 16px}
details{border-bottom:1px solid var(--line);padding:16px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font-weight:600;color:var(--ink-strong)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 20px var(--mono);color:var(--muted)}
details[open] summary::after{content:"−"}
details ol{margin-block:12px 4px;padding-inline-start:20px}
details ol li{margin:4px 0}
details p{margin-top:8px}
kbd{font:12px var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:1px 6px}
.hist li span{color:var(--muted);font-family:var(--mono);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.note{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:14px}
.demo{margin-bottom:24px}
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:12px;line-height:1.6;color:var(--muted)}
footer .made{font-size:14px;color:var(--ink)}
footer a{color:var(--ink-strong);font-weight:600}
.hidden{display:none!important}
.only-touch{display:none!important}
@media (hover:none) and (pointer:coarse){.only-touch{display:block!important}.only-mouse{display:none!important}}
.reveal{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .reveal{animation:in .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*80ms)}
  @keyframes in{from{opacity:.001;transform:translateY(12px)}}
}
@media (max-width:720px){
  main{padding-block-start:24px}
  header{margin-bottom:32px;flex-wrap:wrap}
  h1{font-size:40px}
  .steps{grid-template-columns:1fr;gap:8px}
  .step{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .step::before{margin:0;flex:none}
  .step span{display:block;line-height:1.4}
  .drop{padding:32px 16px}
  .span3,.span6{grid-column:span 6}
  .grid{gap:12px;margin-top:32px}
  .grid .span2{padding:16px}
  .num{font-size:32px}
  .grid .span2 .delta{display:none}
}

  </div>
  <div class="row reveal" style="--i:3;margin:0 0 24px">
    <a class="btn ghost" href="https://accountscenter.instagram.com/info_and_permissions/dyi/" target="_blank" rel="noopener noreferrer"><span data-t="req"></span>&nbsp;↗</a>
  </div>

  <label class="drop reveal" style="--i:4" id="drop">
    <input type="file" id="file" accept=".zip,.json,.html,application/zip" multiple class="hidden">

    <strong class="only-touch" data-t="dropT"></strong>
    <span class="only-mouse" data-t="dropMs"></span>
    <span class="only-touch" data-t="dropTs"></span>
  </label>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <section id="results" class="hidden">

      <div class="card span2"><div class="eyebrow" data-t="kNew"></div><div class="num" id="nNew" style="color:var(--green)">0</div><div class="delta" id="since"></div></div>
      <div class="card span2"><div class="eyebrow" data-t="kLost"></div><div class="num" id="nLost" style="color:var(--red)">0</div><div class="delta" data-t="sinceLast"></div></div>

      <div class="card span3"><span class="tag t-red" data-t="tLost"></span><ul class="list" id="lLost"></ul></div>
      <div class="card span6" id="cNot"><span class="tag t-yellow" data-t="tNot"></span> <span class="eyebrow" id="nNot"></span><ul class="list" id="lNot"></ul></div>
      <div class="card span6" id="cFans"><span class="tag t-blue" data-t="tFans"></span> <span class="eyebrow" id="nFans"></span><ul class="list" id="lFans"></ul></div>
      <div class="card span6" id="cMut"><span class="tag t-green" data-t="tMut"></span> <span class="eyebrow" id="nMut"></span><ul class="list" id="lMut"></ul></div>

  <h2 data-t="hist"></h2>
  <ul class="list hist" id="hist"></ul>
  <div class="row"><button type="button" class="btn ghost" id="exp" data-t="exp"></button><label class="btn ghost" tabindex="0" id="impLabel"><span data-t="imp"></span><input type="file" id="imp" accept=".json,.txt,application/json,text/plain" class="hidden"></label></div>
  <p class="note only-touch" data-th="noteIos"></p>

  <h2 data-t="faq"></h2>
  <details><summary data-t="q1"></summary><ol data-th="a1"></ol></details>
  <details><summary data-t="q2"></summary><p data-t="a2"></p></details>
  <details><summary data-t="q3"></summary><p data-t="a3"></p></details>
  <details><summary data-t="q4"></summary><p data-t="a4"></p></details>

  <footer>
    <p class="made" id="fMade"></p>
    <p id="fCredit"></p>
    <p id="fLegal"></p>

faq:'सवाल',q1:'फ़ाइल माँगने के सटीक चरण',a1:'<li><b>Instagram से मेरी फ़ाइल माँगें</b> पर टैप करें (या: प्रोफ़ाइल › ≡ › अकाउंट्स सेंटर › आपकी जानकारी और अनुमतियाँ › अपनी जानकारी एक्सपोर्ट करें)।</li><li><b>एक्सपोर्ट बनाएँ</b> › आपका अकाउंट › <b>डिवाइस पर एक्सपोर्ट करें</b>।</li><li><b>जानकारी कस्टमाइज़ करें</b>: सब हटाएँ, सिर्फ़ <b>फ़ॉलोअर्स और फ़ॉलोइंग</b> रखें।</li><li><b>तारीख़ सीमा</b>: शुरू से। <b>फ़ॉर्मेट</b>: JSON। <b>एक्सपोर्ट शुरू करें</b> पर टैप करें।</li>',

const AUTHOR='SamuTecYT',REPO='https://github.com/SamuTecYT/follower-diff';
const RTL=new Set(['ar']);
const LKEY='ig-seguidores-lang';
let L='en';
const t=(k,v={})=>String((I18N[L]&&I18N[L][k])??I18N.en[k]??k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');
function pickLang(){
  try{const s=localStorage.getItem(LKEY);if(s&&I18N[s])return s}catch{}
  for(const l of (navigator.languages||[navigator.language||'en'])){const b=String(l).toLowerCase().split('-')[0];if(I18N[b])return b}
  return 'en';
}
function applyLang(code){
  L=I18N[code]?code:'en';
  const root=document.documentElement;root.lang=L;root.dir=RTL.has(L)?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(el=>{el.placeholder=t(el.dataset.tp);el.setAttribute('aria-label',t(el.dataset.tp))});
  document.querySelectorAll('[data-th]').forEach(el=>el.innerHTML=t(el.dataset.th)); // static developer strings only
  $('langSel').value=L;
  // Footer: the author's name becomes a link to the project
  const [pre,post]=t('made',{a:'\u0000'}).split('\u0000'),a=document.createElement('a');
  a.href=REPO;a.target='_blank';a.rel='noopener noreferrer';a.textContent=AUTHOR;
  $('fMade').replaceChildren(pre??'',a,post??'');
  $('fCredit').textContent=t('credit',{a:AUTHOR});
  $('fLegal').textContent=t('legal');
  render();
}

let mem=null,demo=false;
const load=()=>{if(mem)return mem.slice();try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}};
const save=h=>{if(demo){mem=h.slice();return}try{localStorage.setItem(KEY,JSON.stringify(h));mem=null}catch{mem=h.slice()}};
const TAG={green:'ok',red:'warn',blue:'wait'};
function say(k,c='blue',v){const m=$('msg');m.textContent='';if(!k)return;const s=document.createElement('span');s.className='tag t-'+c;s.textContent=t(TAG[c]);m.append(s,' '+t(k,v))}
const fmt=ts=>new Date(ts).toLocaleString(L,{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const nf=n=>new Intl.NumberFormat(L).format(n);

// --- Minimal .zip reader (uses the browser's built-in decompressor, no libraries) ---
async function readZip(buf){
  const v=new DataView(buf),u8=new Uint8Array(buf),out={},td=new TextDecoder();
  let e=buf.byteLength-22;const stop=Math.max(0,e-65557);
  while(e>=stop&&v.getUint32(e,true)!==0x06054b50)e--;
  if(e<stop)throw new Error('zip');
  let p=v.getUint32(e+16,true);const n=v.getUint16(e+10,true);
  for(let i=0;i<n;i++){
    if(v.getUint32(p,true)!==0x02014b50)throw new Error('zip');
    const method=v.getUint16(p+10,true),csize=v.getUint32(p+20,true),usize=v.getUint32(p+24,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!/(followers|following)[^/]*\.(json|html)$/i.test(name)||usize>MAX_ENTRY)continue;
    const s=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),data=u8.subarray(s,s+csize);
    if(method===0)out[name]=td.decode(data);
    else if(method===8)out[name]=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  return out;
}

// --- Extract usernames from Instagram's files (JSON or HTML) ---
function users(text){
  const found=[];
  if(/^\s*[\[{]/.test(text)){
    const walk=o=>{if(Array.isArray(o))return o.forEach(walk);if(o&&typeof o==='object'){
      if(Array.isArray(o.string_list_data)){const d=o.string_list_data[0]||{};found.push(d.value||o.title||String(d.href||'').split('/').filter(Boolean).pop()||'');return}
      Object.values(o).forEach(walk)}};
    walk(JSON.parse(text));
  }else for(const m of text.matchAll(/instagram\.com\/(?:_u\/)?([A-Za-z0-9._]+)/g))found.push(m[1]);
  return clean(found);
}

async function handle(files){
  if(!files.length)return;
  if(demo){demo=false;mem=null;$('demoBar').classList.add('hidden')}
  const drop=$('drop');drop.classList.add('busy');say('reading');
  try{
    if(typeof DecompressionStream==='undefined'){say('old','red');return}
    const all={};
    for(const f of files){
      if(f.size>MAX_FILE){say('tooBig','red');return}
      if(/\.zip$/i.test(f.name)||f.type.includes('zip'))Object.assign(all,await readZip(await f.arrayBuffer()));
      else all[f.name]=await f.text();
    }
    const fol=new Set(),ing=new Set();
    for(const[name,txt]of Object.entries(all)){
      const base=name.split('/').pop().toLowerCase();
      if(/^followers/.test(base))users(txt).forEach(x=>fol.add(x));
      else if(/^following\./.test(base))users(txt).forEach(x=>ing.add(x));
    }
    if(!fol.size){say('noFol','red');return}
    const h=load();h.push({t:Date.now(),followers:[...fol].sort(),following:[...ing].sort()});save(h);
    render();say('saved','green',{n:nf(fol.size)});
    $('results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }catch{say('readErr','red')}
  finally{drop.classList.remove('busy')}
}

// Lists are built without innerHTML: file content is never interpreted as code.
// Big accounts: only PAGE rows are drawn at a time, plus a "show more" button.
const PAGE=100,LISTS={};
function list(el,arr,emptyKey){LISTS[el.id]={el,arr,emptyKey,lim:PAGE};draw(el.id)}
function draw(id){
  const s=LISTS[id],q=query(),arr=q?s.arr.filter(u=>u.includes(q)):s.arr,rows=arr.slice(0,s.lim).map(u=>{const li=document.createElement('li'),a=document.createElement('a');a.href='https://instagram.com/'+encodeURIComponent(u);a.target='_blank';a.rel='noopener noreferrer';a.textContent='@'+u;const av=document.createElement('span'),w=document.createElement('span');av.className='av';av.setAttribute('aria-hidden','true');av.textContent=(u.match(/[a-z0-9]/)||['@'])[0];let h=0;for(const ch of u)h=(h*31+ch.charCodeAt(0))%360;av.style.setProperty('--h',h);w.className='who';w.append(av,a);li.append(w);return li});
  if(arr.length>s.lim){const li=document.createElement('li'),b=document.createElement('button');li.className='more';b.type='button';b.className='btn ghost small';b.textContent=t('more',{n:nf(arr.length-s.lim)});b.onclick=()=>{s.lim+=PAGE*5;draw(id)};li.append(b);rows.push(li)}
  s.el.replaceChildren(...(rows.length?rows:[Object.assign(document.createElement('li'),{className:'empty',textContent:t(q&&s.arr.length?'noMatch':s.emptyKey)})]));
}
// Search: "@Name " -> "name"
const query=()=>$('q').value.trim().replace(/^@+/,'').toLowerCase();
let SETS=null;
function search(){
  for(const id in LISTS){LISTS[id].lim=PAGE;draw(id)}
  const r=$('qRes'),q=query();r.replaceChildren();if(!q||!SETS)return;
  const tag=(c,k)=>{const s=document.createElement('span');s.className='tag t-'+c;s.textContent=t(k);r.append(s)};
  const{fol,ing,nw,lost}=SETS,f=fol.has(q),g=ing.has(q);
  if(f||g||lost.has(q)){
    const b=document.createElement('b');b.textContent='@'+q;r.append(b);
    if(f&&g)tag('green','stBoth');else if(f)tag('blue',ing.size?'stThey':'stFol');else if(g)tag('yellow','stYou');else tag('red','stNone');
    if(nw.has(q))tag('green','stNew');if(lost.has(q))tag('red','stLost');
  }else{
    let n=0;for(const u of new Set([...fol,...ing]))if(u.includes(q))n++;
    r.append(t(n?'matches':'stNone',{n:nf(n)}));
  }
}

function render(){
  const h=load(),hist=$('hist');
  hist.replaceChildren(...(h.length?h.map((s,i)=>{const li=document.createElement('li'),d=document.createElement('div'),sp=document.createElement('span'),b=document.createElement('button');
      sp.textContent=' · '+fmt(s.t);d.append(t('folN',{n:nf(s.followers.length)}),sp);b.type='button';b.className='btn ghost small';b.textContent=t('del');b.dataset.del=i;b.setAttribute('aria-label',t('del')+' '+fmt(s.t));li.append(d,b);return li}).reverse()
    :[Object.assign(document.createElement('li'),{className:'empty',textContent:t('emptyHist')})]));
  if(!h.length){$('results').classList.add('hidden');return}
  const cur=h[h.length-1],prev=h[h.length-2],c=new Set(cur.followers),p=prev?new Set(prev.followers):null;
  const nw=p?cur.followers.filter(x=>!p.has(x)):[],lost=p?prev.followers.filter(x=>!c.has(x)):[];
  $('results').classList.remove('hidden');
  $('nFollowers').textContent=nf(cur.followers.length);
  const d=p?cur.followers.length-prev.followers.length:0;
  $('dFollowers').textContent=p?t('vs',{d:(d>=0?'+':'')+nf(d)}):t('first');
  $('nNew').textContent=nf(nw.length);$('nLost').textContent=nf(lost.length);
  $('since').textContent=p?t('since',{d:fmt(prev.t)}):t('need2');
  list($('lNew'),nw,p?'noneNew':'waitCmp');
  list($('lLost'),lost,p?'noneLost':'waitCmp');
  const not=cur.following.filter(x=>!c.has(x));
  $('cNot').classList.toggle('hidden',!cur.following.length);
  $('nNot').textContent=t('accounts',{n:nf(not.length)});list($('lNot'),not,'allBack');
  const ing=new Set(cur.following),fans=cur.followers.filter(x=>!ing.has(x));
  $('cFans').classList.toggle('hidden',!cur.following.length);
  $('nFans').textContent=t('accounts',{n:nf(fans.length)});list($('lFans'),fans,'allFans');
  const mut=cur.followers.filter(x=>ing.has(x));
  $('cMut').classList.toggle('hidden',!cur.following.length);
  $('nMut').textContent=t('accounts',{n:nf(mut.length)});list($('lMut'),mut,'noMut');
  SETS={fol:c,ing,nw:new Set(nw),lost:new Set(lost)};search();
}

// Example data, only with #demo in the address (never saved)
function loadDemo(){
  demo=true;const now=Date.now(),base=['lucia.mtz','dani_photo','marco.rossi','sakura.t','omar.k','ines_reads','tom.builds','yuki.cafe','leo_runs','nadia.art'];
  mem=[{t:now-6*864e5,followers:[...base,'paulo.surf','kim.studio'].sort(),following:['lucia.mtz','marco.rossi','tom.builds','brand.store','chef.ana']},
       {t:now,followers:[...base,'kim.studio','aria.draws','ben_travel','mei.ling'].sort(),following:['lucia.mtz','marco.rossi','tom.builds','brand.store','chef.ana']}];
  $('demoBar').classList.remove('hidden');
}

// ---------- Events ----------
const drop=$('drop');
['dragenter','dragover'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>handle([...ev.dataTransfer.files]));
let qT;$('q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(search,120)});
$('file').addEventListener('change',ev=>{handle([...ev.target.files]);ev.target.value=''});
// Delete in two taps (no pop-up dialogs, which some browsers block)
$('hist').addEventListener('click',ev=>{const b=ev.target,i=b.dataset.del;if(i===undefined)return;
  if(!b.dataset.sure){b.dataset.sure=1;b.textContent=t('sure');setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent=t('del')}},3000);return}
  const h=load();h.splice(+i,1);save(h);render()});
// Embedded pages can't download files: there the backup goes to the clipboard
const embedded=(()=>{try{return window.top!==window}catch{return true}})();
$('exp').addEventListener('click',async()=>{const h=load();if(!h.length||demo){say('nothing','red');return}
  const txt=JSON.stringify(h);
  if(embedded){try{await navigator.clipboard.writeText(txt);say('copied','green')}catch{say('copyFail','red')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='follower-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('impLabel').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();$('imp').click()}});
$('imp').addEventListener('change',async ev=>{
  try{const raw=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(raw))throw 0;
    const h=raw.filter(s=>s&&Number.isFinite(s.t)).map(s=>({t:s.t,followers:clean(s.followers),following:clean(s.following)})).sort((a,b)=>a.t-b.t);
    if(!h.length)throw 0;demo=false;$('demoBar').classList.add('hidden');save(h);render();say('loaded','green')}
  catch{say('bad','red')}finally{ev.target.value=''}});
const sel=$('langSel');
for(const[code,d]of Object.entries(I18N)){const o=document.createElement('option');o.value=code;o.textContent=d._n;sel.append(o)}
sel.addEventListener('change',()=>{try{localStorage.setItem(LKEY,sel.value)}catch{}applyLang(sel.value);say('')});
const hashLang=/^#demo-?([a-z]{2})?$/.exec(location.hash);
if(hashLang)loadDemo();
applyLang(hashLang&&hashLang[1]&&I18N[hashLang[1]]?hashLang[1]:pickLang());
</script>
