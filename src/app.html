<title>Follower Diff</title>

<meta name="theme-color" id="tcD" content="#191918" media="(prefers-color-scheme: dark)">

<style>
/* Layout: one calm column, document-style; results as a small bento grid */
:root{
  --bg:#F7F6F3;--card:#FFFFFF;--line:#EAEAEA;--ink:#2F3437;--ink-strong:#111111;--muted:#787774;
  --green-bg:#EDF3EC;--green:#346538;--red-bg:#FDEBEC;--red:#9F2F2D;--yellow-bg:#FBF3DB;--yellow:#956400;--blue-bg:#E1F3FE;--blue:#1F6C9F;
  --sans:-apple-system,'SF Pro Display','Helvetica Neue','Segoe UI Variable Display','Segoe UI','Noto Sans',sans-serif;
  --serif:'New York','Iowan Old Style','Palatino Linotype',Georgia,'Noto Serif',serif;
  --mono:'SF Mono','Cascadia Mono',Consolas,monospace;
  --on-ink:#FFFFFF;--ink-hover:#333333;--hover:#FBFBFA;--line-strong:#D6D4CE;--line-hover:#B9B6AE;--av-bg:88%;--av-fg:28%;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --r:12px;--r-sm:6px;--t:.2s;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#191918;--card:#21211F;--line:#33322F;--ink:#D6D5D1;--ink-strong:#F4F3EF;--muted:#9C9A94;
  --green-bg:#1E2D21;--green:#93CF9C;--red-bg:#3A2324;--red:#F2A4A0;--yellow-bg:#352C17;--yellow:#E6C27E;--blue-bg:#192C3B;--blue:#8EC6EF;
  --on-ink:#111111;--ink-hover:#D9D8D3;--hover:#262624;--line-strong:#46453F;--line-hover:#5E5C55;--av-bg:28%;--av-fg:86%;
  color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#191918;--card:#21211F;--line:#33322F;--ink:#D6D5D1;--ink-strong:#F4F3EF;--muted:#9C9A94;
  --green-bg:#1E2D21;--green:#93CF9C;--red-bg:#3A2324;--red:#F2A4A0;--yellow-bg:#352C17;--yellow:#E6C27E;--blue-bg:#192C3B;--blue:#8EC6EF;
  --on-ink:#111111;--ink-hover:#D9D8D3;--hover:#262624;--line-strong:#46453F;--line-hover:#5E5C55;--av-bg:28%;--av-fg:86%;
  color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 400px at 80% -10%,rgba(214,180,140,.12),transparent 70%)}
main{max-width:880px;margin:0 auto;padding-block:64px calc(96px + env(safe-area-inset-bottom));padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));position:relative}
header{display:flex;align-items:center;gap:12px;margin-bottom:48px}
header img{width:40px;height:40px;border-radius:10px}
.brand{flex:1;min-width:0}
.lang{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding-inline:12px 4px;min-height:44px}
.lang svg{flex:none}
.tbtn{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;background:var(--card);color:var(--ink-strong);border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;transition:border-color var(--t),transform .12s var(--ease-out)}
.tbtn:active{transform:scale(.94)}
.tbtn:focus-visible{outline:2px solid var(--ink-strong);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.tbtn:hover{border-color:var(--line-hover)}}
.tbtn .i-sun,.tbtn.dark .i-moon{display:none}.tbtn.dark .i-sun{display:block}
.lang select{font:500 14px var(--sans);color:var(--ink-strong);background:transparent;border:0;min-height:42px;padding-inline:4px 8px;cursor:pointer;max-width:160px}
.lang:focus-within{outline:2px solid var(--ink-strong);outline-offset:2px}
.lang select:focus{outline:none}
.lang select option{background:var(--card);color:var(--ink-strong)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:400 56px/1.1 var(--serif);letter-spacing:-.03em;color:var(--ink-strong);margin-bottom:12px;text-wrap:balance}
:lang(ar) h1,:lang(zh) h1,:lang(ja) h1,:lang(ko) h1,:lang(hi) h1{letter-spacing:0;font-family:var(--sans);font-weight:600;line-height:1.25}
:lang(ar) .eyebrow,:lang(zh) .eyebrow,:lang(ja) .eyebrow,:lang(ko) .eyebrow,:lang(hi) .eyebrow{letter-spacing:0;font-family:var(--sans)}
.lead{color:var(--muted);max-width:560px;margin-bottom:32px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:14px;counter-increment:s}
.step::before{content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font:500 12px var(--mono);margin-bottom:8px}
.step b{display:block;color:var(--ink-strong)}
.step span{color:var(--muted);font-size:13px}
.drop{display:block;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--card);padding:48px 32px;text-align:center;cursor:pointer;transition:background var(--t),border-color var(--t)}
.drop.over{background:var(--hover);border-color:var(--line-hover)}
@media (hover:hover) and (pointer:fine){.drop:hover{background:var(--hover);border-color:var(--line-hover)}}
.drop:focus-within{outline:2px solid var(--ink-strong);outline-offset:2px}
.drop svg{color:var(--ink-strong)}
.drop strong{display:block;color:var(--ink-strong);font-weight:600;margin:12px 0 4px}
.drop span{color:var(--muted);font-size:13px}
.drop.busy{opacity:.6;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;font:500 14px var(--sans);background:var(--ink-strong);color:var(--on-ink);border:0;border-radius:var(--r-sm);padding:10px 16px;cursor:pointer;text-decoration:none;transition:background-color var(--t),transform .12s var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ink-strong);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--ink-hover)}.btn.ghost:hover{background:var(--card)}}
.btn.small{min-height:36px;padding:4px 12px;font-size:12px}
.msg{margin-top:16px;font-size:14px;min-height:24px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;transition:box-shadow var(--t);min-width:0}
@media (hover:hover) and (pointer:fine){.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span6{grid-column:span 6}
.num{font:400 44px/1 var(--serif);letter-spacing:-.02em;color:var(--ink-strong);margin-top:8px;font-variant-numeric:tabular-nums}
.delta{font:500 12px var(--mono);margin-top:8px;color:var(--muted)}
.tag{display:inline-block;font:600 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:9999px}
.t-green{background:var(--green-bg);color:var(--green)}.t-red{background:var(--red-bg);color:var(--red)}.t-yellow{background:var(--yellow-bg);color:var(--yellow)}.t-blue{background:var(--blue-bg);color:var(--blue)}
.list{list-style:none;padding:0;margin-top:16px;max-height:340px;overflow:auto}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li:last-child{border-bottom:0}
.list a{color:var(--ink-strong);text-decoration:none;font-family:var(--mono);font-size:13px;padding:8px 0;direction:ltr;unicode-bidi:isolate}
.list a:hover{text-decoration:underline}
.empty{color:var(--muted)}
.search{width:100%;min-height:48px;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink-strong);font:inherit;font-size:16px}
.search:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.qres{margin-top:12px;min-height:24px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font:600 13px/1 var(--mono);text-transform:uppercase;background:hsl(var(--h) 40% var(--av-bg));color:hsl(var(--h) 45% var(--av-fg))}
.list li .who{display:flex;align-items:center;gap:12px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch .cp{margin-inline-start:auto}
.acct{margin-top:16px;padding:16px 24px}
.acct-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.acct-row>div:first-child{flex:1;min-width:200px}
.acct b{display:block;color:var(--ink-strong)}
.acct span{color:var(--muted);font-size:13px}
.aform{display:grid;gap:8px;margin-top:16px;max-width:420px}
.aform .search{min-height:44px;padding:8px 12px}
.fine{font-size:12px;color:var(--muted)}
.qres>*{transition:opacity .15s var(--ease-out),transform .15s var(--ease-out)}
@media (prefers-reduced-motion:no-preference){
  @starting-style{.qres>*{opacity:0;transform:translateY(4px)}}
  .aform{transition:opacity .2s var(--ease-out),transform .2s var(--ease-out)}
  @starting-style{.aform{opacity:0;transform:translateY(-6px)}}
}
@media (prefers-reduced-motion:reduce){@starting-style{.qres>*{opacity:0}}}
.list li.more{justify-content:center;border-bottom:0}
h2{font:400 32px/1.1 var(--serif);letter-spacing:-.02em;color:var(--ink-strong);margin:64px 0 16px}
details{border-bottom:1px solid var(--line);padding:16px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font-weight:600;color:var(--ink-strong)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:400 20px var(--mono);color:var(--muted)}
details[open] summary::after{content:"−"}
details ol{margin-block:12px 4px;padding-inline-start:20px}
details ol li{margin:4px 0}
details p{margin-top:8px}
kbd{font:12px var(--mono);border:1px solid var(--line);border-radius:4px;background:var(--bg);padding:1px 6px}
.hist li span{color:var(--muted);font-family:var(--mono);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.note{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:14px}
.demo{margin-bottom:24px}
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:8px;font-size:12px;line-height:1.6;color:var(--muted)}
footer .made{font-size:14px;color:var(--ink)}
footer a{color:var(--ink-strong);font-weight:600}
.hidden{display:none!important}
.only-touch{display:none!important}
@media (hover:none) and (pointer:coarse){.only-touch{display:block!important}.only-mouse{display:none!important}}
.reveal{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .reveal{animation:in .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*80ms)}
  @keyframes in{from{opacity:.001;transform:translateY(12px)}}
  .grid .reveal{animation-duration:.4s;animation-delay:calc(var(--i,0)*50ms)}
}
@media (max-width:720px){
  main{padding-block-start:24px}
  header{margin-bottom:32px;flex-wrap:wrap}
  .brand{flex-basis:calc(100% - 52px)}
  h1{font-size:40px}
  .steps{grid-template-columns:1fr;gap:8px}
  .step{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .step::before{margin:0;flex:none}
  .step span{display:block;line-height:1.4}
  .drop{padding:32px 16px}
  .span3,.span6{grid-column:span 6}
  .grid{gap:12px;margin-top:32px}
  .grid .span2{padding:16px}
  .num{font-size:32px}
  .grid .span2 .delta{display:none}
}
</style>
</head>
<body>
<main>
  <header class="reveal">
    <img src="__LOGO_SVG__" alt="">
    <div class="brand"><div class="eyebrow" data-t="eyebrow"></div><div style="font-weight:600;color:var(--ink-strong)" data-t="app"></div></div>
    <button type="button" class="tbtn" id="themeBtn"><svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <label class="lang" for="langSel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
      <select id="langSel" aria-label="Language"></select>
    </label>
  </header>

  <div id="demoBar" class="note demo hidden"><span class="tag t-blue" data-t="demoTag"></span> <span data-t="demoTxt"></span></div>

  <h1 class="reveal" style="--i:1" data-th="h1"></h1>
  <p class="lead reveal" style="--i:2" data-t="lead"></p>

  <div class="steps reveal" style="--i:3">
    <div class="step"><div><b data-t="s1b"></b><span data-t="s1s"></span></div></div>
    <div class="step"><div><b data-t="s2b"></b><span data-t="s2s"></span></div></div>
    <div class="step"><div><b data-t="s3b"></b><span data-t="s3s"></span></div></div>
  </div>
  <div class="row reveal" style="--i:3;margin:0 0 24px">
    <a class="btn only-touch" href="instagram://app" data-t="igApp"></a>
    <a class="btn ghost" href="https://accountscenter.instagram.com/info_and_permissions/dyi/" target="_blank" rel="noopener noreferrer"><span class="only-mouse" data-t="req"></span><span class="only-touch" data-t="igWeb"></span>&nbsp;↗</a>
  </div>
  <p class="fine only-touch reveal" style="--i:3;margin:-12px 0 24px" data-t="igPath"></p>

  <label class="drop reveal" style="--i:4" id="drop">
    <input type="file" id="file" accept=".zip,.json,.html,application/zip" multiple class="hidden">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    <strong class="only-mouse" data-t="dropM"></strong>
    <strong class="only-touch" data-t="dropT"></strong>
    <span class="only-mouse" data-t="dropMs"></span>
    <span class="only-touch" data-t="dropTs"></span>
  </label>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <section class="card acct" id="acct" aria-labelledby="acT">
    <div id="aNone">
      <div class="acct-row"><div><b id="acT" data-t="acTitle"></b><span data-t="acSub"></span></div><div class="row" style="margin-top:0"><button type="button" class="btn small" id="aLogin" data-t="acLogin" aria-expanded="false" aria-controls="aLoginBox"></button><button type="button" class="btn ghost small" id="aOpen" data-t="acCreate" aria-expanded="false" aria-controls="aNew"></button></div></div>
      <div id="aLoginBox" class="aform hidden"><p class="fine" data-t="acLoginHelp"></p><a class="fine" href="#sync" id="syncLink" data-t="q5"></a><button type="button" class="btn" id="aPick" data-t="acPick"></button></div>
      <form id="aNew" class="aform hidden" novalidate>
        <input class="search" id="aName" autocomplete="username" data-tp="acName" maxlength="40" required>
        <input class="search" id="aPass" type="password" autocomplete="new-password" data-tp="acPass" required>
        <input class="search" id="aPass2" type="password" autocomplete="new-password" data-tp="acPass2" required>
        <button class="btn" data-t="acCreate"></button>
        <p class="fine" data-t="acWarn"></p>
      </form>
    </div>
    <form id="aLock" class="hidden" novalidate>
      <div class="acct-row"><div><b id="aHello"></b><span data-t="acLockedSub"></span></div></div>
      <div class="aform">
        <input id="aUser" autocomplete="username" class="hidden" tabindex="-1" aria-hidden="true">
        <input class="search" id="aPassIn" type="password" autocomplete="current-password" data-tp="acPass" required>
        <button class="btn" data-t="acEnter"></button>
        <button type="button" class="btn ghost small" id="aForgot" data-t="acForgot"></button>
      </div>
    </form>
    <div id="aIn" class="acct-row hidden"><div><b id="aHi"></b><span data-t="acOpenSub"></span></div><div class="row" style="margin-top:0"><button type="button" class="btn small" id="aMove" data-t="acMove"></button><button type="button" class="btn ghost small" id="aOut" data-t="acOut"></button><button type="button" class="btn ghost small" id="aRemove" data-t="acRemove"></button></div></div>
    <p class="fine" id="aMoveNote" data-t="acMoveNote" style="margin-top:12px"></p>
  </section>

  <section id="results" class="hidden">
    <div class="grid">
      <div class="card reveal span2" style="--i:0"><div class="eyebrow" data-t="kFol"></div><div class="num" id="nFollowers">0</div><div class="delta" id="dFollowers"></div></div>
      <div class="card reveal span2" style="--i:1"><div class="eyebrow" data-t="kNew"></div><div class="num" id="nNew" style="color:var(--green)">0</div><div class="delta" id="since"></div></div>
      <div class="card reveal span2" style="--i:2"><div class="eyebrow" data-t="kLost"></div><div class="num" id="nLost" style="color:var(--red)">0</div><div class="delta" data-t="sinceLast"></div></div>
      <div class="card reveal span6" style="--i:3"><input type="search" class="search" id="q" data-tp="qPh" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="31"><div class="qres" id="qRes" aria-live="polite"></div></div>
      <div class="card reveal span3" style="--i:4"><div class="ch"><span class="tag t-green" data-t="tNew"></span><button type="button" class="btn ghost small cp" data-l="lNew" data-t="copy"></button></div><ul class="list" id="lNew"></ul></div>
      <div class="card reveal span3" style="--i:5"><div class="ch"><span class="tag t-red" data-t="tLost"></span><button type="button" class="btn ghost small cp" data-l="lLost" data-t="copy"></button></div><ul class="list" id="lLost"></ul></div>
      <div class="card reveal span6" id="cNot" style="--i:6"><div class="ch"><span class="tag t-yellow" data-t="tNot"></span> <span class="eyebrow" id="nNot"></span><button type="button" class="btn ghost small cp" data-l="lNot" data-t="copy"></button></div><ul class="list" id="lNot"></ul></div>
      <div class="card reveal span6" id="cFans" style="--i:7"><div class="ch"><span class="tag t-blue" data-t="tFans"></span> <span class="eyebrow" id="nFans"></span><button type="button" class="btn ghost small cp" data-l="lFans" data-t="copy"></button></div><ul class="list" id="lFans"></ul></div>
      <div class="card reveal span6" id="cMut" style="--i:8"><div class="ch"><span class="tag t-green" data-t="tMut"></span> <span class="eyebrow" id="nMut"></span><button type="button" class="btn ghost small cp" data-l="lMut" data-t="copy"></button></div><ul class="list" id="lMut"></ul></div>
    </div>
  </section>

  <h2 data-t="hist"></h2>
  <ul class="list hist" id="hist"></ul>
  <div class="row"><button type="button" class="btn ghost" id="exp" data-t="exp"></button><label class="btn ghost" tabindex="0" id="impLabel"><span data-t="imp"></span><input type="file" id="imp" accept=".json,.txt,application/json,text/plain" class="hidden"></label></div>
  <p class="note only-touch" data-th="noteIos"></p>

  <h2 data-t="faq"></h2>
  <details><summary data-t="q1"></summary><ol data-th="a1"></ol></details>

const EXTRA4={"es":{"q5":"¿Cómo veo mi historial en el ordenador y en el móvil?","a5":"<li><b>En el ordenador:</b> pulsa <b>Guardar copia del historial</b>. Se descarga <code>follower-history-locked.json</code>.</li><li><b>Pásalo al móvil:</b> por AirDrop (iPhone con Mac), enviándotelo a ti mismo por correo, WhatsApp o Telegram, o subiéndolo a iCloud Drive o Google Drive. Va cifrado: sin tu contraseña nadie puede leerlo.</li><li><b>En el móvil:</b> guarda el archivo en <b>Archivos</b>, abre esta página y pulsa <b>Iniciar sesión › Elegir mi copia cifrada</b>. Escribe tu contraseña.</li><li><b>Para seguir al día:</b> después de subir un archivo nuevo de Instagram, guarda otra copia y pásala al otro aparato. Funciona en los dos sentidos.</li>","a5n":"Los aparatos no se sincronizan solos: cada uno guarda su propio historial."},"en":{"q5":"How do I see my history on my computer and my phone?","a5":"<li><b>On the computer:</b> tap <b>Save a backup</b>. You get <code>follower-history-locked.json</code>.</li><li><b>Send it to your phone:</b> AirDrop (iPhone with Mac), email or WhatsApp/Telegram it to yourself, or put it in iCloud Drive or Google Drive. It's encrypted: without your password no one can read it.</li><li><b>On the phone:</b> save the file in <b>Files</b>, open this page and tap <b>Sign in › Choose my encrypted backup</b>. Type your password.</li><li><b>To stay up to date:</b> after adding a new Instagram file, save a new backup and send it to the other device. It works both ways.</li>","a5n":"Devices don't sync by themselves: each one keeps its own history."},"pt":{"q5":"Como vejo meu histórico no computador e no celular?","a5":"<li><b>No computador:</b> toque em <b>Salvar cópia do histórico</b>. Baixa <code>follower-history-locked.json</code>.</li><li><b>Envie ao celular:</b> por AirDrop (iPhone com Mac), por e-mail, WhatsApp ou Telegram para você mesmo, ou pelo iCloud Drive ou Google Drive. É criptografado: sem sua senha ninguém lê.</li><li><b>No celular:</b> salve o arquivo em <b>Arquivos</b>, abra esta página e toque em <b>Entrar › Escolher minha cópia</b>. Digite a senha.</li><li><b>Para manter em dia:</b> depois de um novo arquivo do Instagram, salve outra cópia e envie ao outro aparelho. Funciona nos dois sentidos.</li>","a5n":"Os aparelhos não sincronizam sozinhos: cada um guarda seu próprio histórico."},"fr":{"q5":"Comment voir mon historique sur ordinateur et téléphone ?","a5":"<li><b>Sur l’ordinateur :</b> touchez <b>Sauvegarder l’historique</b>. Vous obtenez <code>follower-history-locked.json</code>.</li><li><b>Envoyez-le au téléphone :</b> AirDrop (iPhone et Mac), e-mail, WhatsApp ou Telegram à vous-même, ou iCloud Drive / Google Drive. Il est chiffré : sans mot de passe, illisible.</li><li><b>Sur le téléphone :</b> enregistrez le fichier dans <b>Fichiers</b>, ouvrez cette page et touchez <b>Se connecter › Choisir ma sauvegarde</b>. Saisissez le mot de passe.</li><li><b>Pour rester à jour :</b> après un nouveau fichier Instagram, refaites une sauvegarde et envoyez-la à l’autre appareil. Ça marche dans les deux sens.</li>","a5n":"Les appareils ne se synchronisent pas seuls : chacun garde son propre historique."},"de":{"q5":"Wie sehe ich meinen Verlauf auf Computer und Handy?","a5":"<li><b>Am Computer:</b> tippe auf <b>Sicherung speichern</b>. Du erhältst <code>follower-history-locked.json</code>.</li><li><b>Aufs Handy schicken:</b> per AirDrop (iPhone mit Mac), per E-Mail, WhatsApp oder Telegram an dich selbst, oder über iCloud Drive / Google Drive. Sie ist verschlüsselt: ohne Passwort unlesbar.</li><li><b>Am Handy:</b> speichere die Datei in <b>Dateien</b>, öffne diese Seite und tippe auf <b>Anmelden › Sicherung auswählen</b>. Gib dein Passwort ein.</li><li><b>Auf dem Laufenden bleiben:</b> nach einer neuen Instagram-Datei eine neue Sicherung speichern und aufs andere Gerät schicken. Geht in beide Richtungen.</li>","a5n":"Die Geräte synchronisieren sich nicht von selbst: jedes hat seinen eigenen Verlauf."},"it":{"q5":"Come vedo la cronologia su computer e telefono?","a5":"<li><b>Sul computer:</b> tocca <b>Salva una copia</b>. Ottieni <code>follower-history-locked.json</code>.</li><li><b>Mandala al telefono:</b> AirDrop (iPhone con Mac), email, WhatsApp o Telegram a te stesso, oppure iCloud Drive o Google Drive. È cifrata: senza password nessuno può leggerla.</li><li><b>Sul telefono:</b> salva il file in <b>File</b>, apri questa pagina e tocca <b>Accedi › Scegli la mia copia</b>. Scrivi la password.</li><li><b>Per restare aggiornato:</b> dopo un nuovo file di Instagram, salva un’altra copia e mandala all’altro dispositivo. Funziona in entrambi i sensi.</li>","a5n":"I dispositivi non si sincronizzano da soli: ognuno ha la sua cronologia."},"ru":{"q5":"Как видеть историю и на компьютере, и на телефоне?","a5":"<li><b>На компьютере:</b> нажмите <b>Сохранить копию</b>. Скачается <code>follower-history-locked.json</code>.</li><li><b>Перешлите на телефон:</b> через AirDrop (iPhone и Mac), по почте, в WhatsApp или Telegram самому себе, или через iCloud Drive / Google Drive. Файл зашифрован: без пароля его не прочитать.</li><li><b>На телефоне:</b> сохраните файл в <b>Файлы</b>, откройте эту страницу и нажмите <b>Войти › Выбрать мою копию</b>. Введите пароль.</li><li><b>Чтобы всё было актуально:</b> после нового файла Instagram сохраните новую копию и перешлите на другое устройство. Работает в обе стороны.</li>","a5n":"Устройства не синхронизируются сами: у каждого своя история."},"tr":{"q5":"Geçmişimi bilgisayarda ve telefonda nasıl görürüm?","a5":"<li><b>Bilgisayarda:</b> <b>Yedek kaydet</b>’e dokun. <code>follower-history-locked.json</code> iner.</li><li><b>Telefona gönder:</b> AirDrop (iPhone ve Mac), kendine e-posta, WhatsApp veya Telegram ile ya da iCloud Drive / Google Drive ile. Şifrelidir: şifren olmadan kimse okuyamaz.</li><li><b>Telefonda:</b> dosyayı <b>Dosyalar</b>’a kaydet, bu sayfayı aç ve <b>Giriş yap › Şifreli yedeğimi seç</b>’e dokun. Şifreni yaz.</li><li><b>Güncel kalmak için:</b> yeni bir Instagram dosyasından sonra yeni yedek kaydet ve diğer cihaza gönder. İki yönde de çalışır.</li>","a5n":"Cihazlar kendi kendine eşitlenmez: her biri kendi geçmişini tutar."},"ar":{"q5":"كيف أرى سجلي على الحاسوب والهاتف؟","a5":"<li><b>على الحاسوب:</b> اضغط <b>حفظ نسخة احتياطية</b>. سيُنزَّل <code>follower-history-locked.json</code>.</li><li><b>أرسله إلى الهاتف:</b> عبر AirDrop (آيفون مع ماك)، أو أرسله لنفسك بالبريد أو واتساب أو تيليغرام، أو عبر iCloud Drive أو Google Drive. الملف مشفر: لا يمكن قراءته دون كلمة المرور.</li><li><b>على الهاتف:</b> احفظ الملف في <b>الملفات</b>، وافتح هذه الصفحة واضغط <b>تسجيل الدخول › اختيار نسختي المشفرة</b>. اكتب كلمة المرور.</li><li><b>للبقاء محدثًا:</b> بعد كل ملف جديد من إنستغرام احفظ نسخة جديدة وأرسلها إلى الجهاز الآخر. يعمل في الاتجاهين.</li>","a5n":"الأجهزة لا تتزامن تلقائيًا: لكل جهاز سجله الخاص."},"hi":{"q5":"कंप्यूटर और फ़ोन दोनों पर इतिहास कैसे देखूँ?","a5":"<li><b>कंप्यूटर पर:</b> <b>बैकअप सहेजें</b> दबाएँ। <code>follower-history-locked.json</code> डाउनलोड होगी।</li><li><b>फ़ोन पर भेजें:</b> AirDrop (iPhone और Mac), खुद को ईमेल, WhatsApp या Telegram से, या iCloud Drive / Google Drive से। फ़ाइल एन्क्रिप्टेड है: पासवर्ड के बिना कोई नहीं पढ़ सकता।</li><li><b>फ़ोन पर:</b> फ़ाइल <b>Files</b> में सहेजें, यह पेज खोलें और <b>साइन इन › मेरा बैकअप चुनें</b> दबाएँ। पासवर्ड लिखें।</li><li><b>अपडेट रहने के लिए:</b> नई Instagram फ़ाइल के बाद नया बैकअप सहेजें और दूसरे डिवाइस पर भेजें। दोनों तरफ़ काम करता है।</li>","a5n":"डिवाइस अपने-आप सिंक नहीं होते: हर एक का अपना इतिहास होता है।"},"zh":{"q5":"如何在电脑和手机上都看到历史记录？","a5":"<li><b>在电脑上：</b>点击<b>保存备份</b>，会下载 <code>follower-history-locked.json</code>。</li><li><b>发到手机：</b>用 AirDrop（iPhone 配 Mac），或通过邮件、微信、WhatsApp、Telegram 发给自己，或放到 iCloud Drive / Google Drive。文件已加密：没有密码谁也读不了。</li><li><b>在手机上：</b>把文件存到<b>文件</b> App，打开本页面，点<b>登录 › 选择我的加密备份</b>，输入密码。</li><li><b>保持同步：</b>每次添加新的 Instagram 文件后，重新保存备份并发到另一台设备。双向都可以。</li>","a5n":"设备之间不会自动同步：每台设备保存各自的历史记录。"},"ja":{"q5":"パソコンとスマホの両方で履歴を見るには？","a5":"<li><b>パソコンで：</b><b>バックアップを保存</b>をタップ。<code>follower-history-locked.json</code> がダウンロードされます。</li><li><b>スマホへ送る：</b>AirDrop（iPhoneとMac）、自分宛てのメール・LINE・WhatsApp・Telegram、または iCloud Drive / Google Drive で。暗号化されているので、パスワードなしでは誰も読めません。</li><li><b>スマホで：</b>ファイルを<b>ファイル</b>アプリに保存し、このページを開いて<b>ログイン › 暗号化バックアップを選ぶ</b>をタップ。パスワードを入力します。</li><li><b>最新に保つには：</b>新しいInstagramファイルを追加したら、もう一度バックアップを保存してもう一方の端末へ送ります。どちら向きでもOKです。</li>","a5n":"端末どうしは自動で同期されません。それぞれが自分の履歴を持ちます。"},"ko":{"q5":"컴퓨터와 휴대폰 모두에서 기록을 보려면?","a5":"<li><b>컴퓨터에서:</b> <b>백업 저장</b>을 누르세요. <code>follower-history-locked.json</code> 파일이 받아져요.</li><li><b>휴대폰으로 보내기:</b> AirDrop(iPhone과 Mac), 나에게 이메일·카카오톡·WhatsApp·Telegram 보내기, 또는 iCloud Drive / Google Drive. 암호화되어 있어 비밀번호 없이는 아무도 못 읽어요.</li><li><b>휴대폰에서:</b> 파일을 <b>파일</b> 앱에 저장하고 이 페이지에서 <b>로그인 › 암호화 백업 선택</b>을 누른 뒤 비밀번호를 입력하세요.</li><li><b>최신으로 유지하려면:</b> 새 Instagram 파일을 올린 뒤 백업을 다시 저장해 다른 기기로 보내세요. 양쪽 방향 모두 돼요.</li>","a5n":"기기끼리 자동으로 동기화되지 않아요: 각 기기가 자기 기록을 가져요."},"id":{"q5":"Bagaimana melihat riwayat di komputer dan ponsel?","a5":"<li><b>Di komputer:</b> ketuk <b>Simpan cadangan</b>. Kamu mendapat <code>follower-history-locked.json</code>.</li><li><b>Kirim ke ponsel:</b> lewat AirDrop (iPhone dan Mac), email, WhatsApp atau Telegram ke diri sendiri, atau iCloud Drive / Google Drive. File terenkripsi: tanpa kata sandi tak ada yang bisa membaca.</li><li><b>Di ponsel:</b> simpan file di <b>File</b>, buka halaman ini lalu ketuk <b>Masuk › Pilih cadangan saya</b>. Ketik kata sandi.</li><li><b>Agar tetap terbaru:</b> setelah file Instagram baru, simpan cadangan lagi dan kirim ke perangkat lain. Bisa dua arah.</li>","a5n":"Perangkat tidak tersinkron sendiri: masing-masing punya riwayatnya sendiri."}};

const EXTRA5={"es":{"acLogin":"Ya tengo cuenta","acLoginHelp":"Elige tu archivo de cuenta (follower-account.json) y escribe tu contraseña.","acPick":"Elegir archivo de cuenta","acMove":"Pasar a otro aparato","acMoved":"Archivo de cuenta descargado. Envíatelo al otro aparato y allí pulsa «Ya tengo cuenta».","q5":"¿Cómo uso mi cuenta en otro aparato?","a5":"<li>En este aparato pulsa <b>Pasar a otro aparato</b>. Se descarga <code>follower-account.json</code>.</li><li>Envíate ese archivo: por WhatsApp, correo, AirDrop o Drive. Va cifrado, nadie puede leerlo sin tu contraseña.</li><li>En el otro aparato abre la app, pulsa <b>Ya tengo cuenta</b>, elige el archivo y escribe tu contraseña.</li>","a5n":"Los aparatos no se sincronizan solos: cuando subas un archivo nuevo de Instagram, repite estos pasos."},"en":{"acLogin":"I have an account","acLoginHelp":"Choose your account file (follower-account.json) and type your password.","acPick":"Choose account file","acMove":"Move to another device","acMoved":"Account file downloaded. Send it to your other device and tap “I have an account” there.","q5":"How do I use my account on another device?","a5":"<li>On this device tap <b>Move to another device</b>. You get <code>follower-account.json</code>.</li><li>Send yourself that file: WhatsApp, email, AirDrop or Drive. It's encrypted: no one can read it without your password.</li><li>On the other device open the app, tap <b>I have an account</b>, choose the file and type your password.</li>","a5n":"Devices don't sync by themselves: after adding a new Instagram file, repeat these steps."},"pt":{"acLogin":"Já tenho conta","acLoginHelp":"Escolha seu arquivo de conta (follower-account.json) e digite a senha.","acPick":"Escolher arquivo de conta","acMove":"Passar para outro aparelho","acMoved":"Arquivo de conta baixado. Envie para o outro aparelho e lá toque em “Já tenho conta”.","q5":"Como uso minha conta em outro aparelho?","a5":"<li>Neste aparelho toque em <b>Passar para outro aparelho</b>. Baixa <code>follower-account.json</code>.</li><li>Envie o arquivo para você: WhatsApp, e-mail, AirDrop ou Drive. É criptografado: ninguém lê sem sua senha.</li><li>No outro aparelho abra o app, toque em <b>Já tenho conta</b>, escolha o arquivo e digite a senha.</li>","a5n":"Os aparelhos não sincronizam sozinhos: após um novo arquivo do Instagram, repita estes passos."},"fr":{"acLogin":"J’ai déjà un compte","acLoginHelp":"Choisissez votre fichier de compte (follower-account.json) et saisissez le mot de passe.","acPick":"Choisir le fichier de compte","acMove":"Passer à un autre appareil","acMoved":"Fichier de compte téléchargé. Envoyez-le à l’autre appareil et touchez « J’ai déjà un compte ».","q5":"Comment utiliser mon compte sur un autre appareil ?","a5":"<li>Sur cet appareil, touchez <b>Passer à un autre appareil</b>. Vous obtenez <code>follower-account.json</code>.</li><li>Envoyez-vous ce fichier : WhatsApp, e-mail, AirDrop ou Drive. Il est chiffré : illisible sans mot de passe.</li><li>Sur l’autre appareil, ouvrez l’app, touchez <b>J’ai déjà un compte</b>, choisissez le fichier et saisissez le mot de passe.</li>","a5n":"Les appareils ne se synchronisent pas seuls : après un nouveau fichier Instagram, refaites ces étapes."},"de":{"acLogin":"Ich habe ein Konto","acLoginHelp":"Wähle deine Kontodatei (follower-account.json) und gib dein Passwort ein.","acPick":"Kontodatei auswählen","acMove":"Auf anderes Gerät übertragen","acMoved":"Kontodatei heruntergeladen. Schick sie an dein anderes Gerät und tippe dort auf „Ich habe ein Konto“.","q5":"Wie nutze ich mein Konto auf einem anderen Gerät?","a5":"<li>Tippe hier auf <b>Auf anderes Gerät übertragen</b>. Du erhältst <code>follower-account.json</code>.</li><li>Schick dir die Datei: WhatsApp, E-Mail, AirDrop oder Drive. Sie ist verschlüsselt: ohne Passwort unlesbar.</li><li>Öffne auf dem anderen Gerät die App, tippe auf <b>Ich habe ein Konto</b>, wähle die Datei und gib dein Passwort ein.</li>","a5n":"Geräte synchronisieren sich nicht selbst: nach einer neuen Instagram-Datei diese Schritte wiederholen."},"it":{"acLogin":"Ho già un account","acLoginHelp":"Scegli il tuo file account (follower-account.json) e scrivi la password.","acPick":"Scegli file account","acMove":"Passa a un altro dispositivo","acMoved":"File account scaricato. Mandalo all’altro dispositivo e lì tocca “Ho già un account”.","q5":"Come uso il mio account su un altro dispositivo?","a5":"<li>Su questo dispositivo tocca <b>Passa a un altro dispositivo</b>. Ottieni <code>follower-account.json</code>.</li><li>Mandati il file: WhatsApp, email, AirDrop o Drive. È cifrato: nessuno può leggerlo senza password.</li><li>Sull’altro dispositivo apri l’app, tocca <b>Ho già un account</b>, scegli il file e scrivi la password.</li>","a5n":"I dispositivi non si sincronizzano da soli: dopo un nuovo file di Instagram, ripeti questi passi."},"ru":{"acLogin":"У меня есть аккаунт","acLoginHelp":"Выберите файл аккаунта (follower-account.json) и введите пароль.","acPick":"Выбрать файл аккаунта","acMove":"Перенести на другое устройство","acMoved":"Файл аккаунта скачан. Отправьте его на другое устройство и нажмите там «У меня есть аккаунт».","q5":"Как пользоваться аккаунтом на другом устройстве?","a5":"<li>Здесь нажмите <b>Перенести на другое устройство</b>. Скачается <code>follower-account.json</code>.</li><li>Отправьте себе файл: WhatsApp, почта, AirDrop или Drive. Он зашифрован: без пароля не прочитать.</li><li>На другом устройстве откройте приложение, нажмите <b>У меня есть аккаунт</b>, выберите файл и введите пароль.</li>","a5n":"Устройства не синхронизируются сами: после нового файла Instagram повторите эти шаги."},"tr":{"acLogin":"Hesabım var","acLoginHelp":"Hesap dosyanı (follower-account.json) seç ve şifreni yaz.","acPick":"Hesap dosyasını seç","acMove":"Başka cihaza taşı","acMoved":"Hesap dosyası indirildi. Diğer cihazına gönder ve orada “Hesabım var”a dokun.","q5":"Hesabımı başka bir cihazda nasıl kullanırım?","a5":"<li>Bu cihazda <b>Başka cihaza taşı</b>’ya dokun. <code>follower-account.json</code> iner.</li><li>Dosyayı kendine gönder: WhatsApp, e-posta, AirDrop veya Drive. Şifrelidir: şifren olmadan okunamaz.</li><li>Diğer cihazda uygulamayı aç, <b>Hesabım var</b>’a dokun, dosyayı seç ve şifreni yaz.</li>","a5n":"Cihazlar kendiliğinden eşitlenmez: yeni bir Instagram dosyasından sonra bu adımları tekrarla."},"ar":{"acLogin":"لدي حساب","acLoginHelp":"اختر ملف حسابك (follower-account.json) واكتب كلمة المرور.","acPick":"اختيار ملف الحساب","acMove":"نقل إلى جهاز آخر","acMoved":"تم تنزيل ملف الحساب. أرسله إلى جهازك الآخر واضغط هناك «لدي حساب».","q5":"كيف أستخدم حسابي على جهاز آخر؟","a5":"<li>على هذا الجهاز اضغط <b>نقل إلى جهاز آخر</b>. سيُنزَّل <code>follower-account.json</code>.</li><li>أرسل الملف لنفسك: واتساب أو البريد أو AirDrop أو Drive. الملف مشفر: لا يُقرأ دون كلمة المرور.</li><li>على الجهاز الآخر افتح التطبيق واضغط <b>لدي حساب</b> واختر الملف واكتب كلمة المرور.</li>","a5n":"الأجهزة لا تتزامن تلقائيًا: بعد كل ملف جديد من إنستغرام كرر هذه الخطوات."},"hi":{"acLogin":"मेरा अकाउंट है","acLoginHelp":"अपनी अकाउंट फ़ाइल (follower-account.json) चुनें और पासवर्ड लिखें।","acPick":"अकाउंट फ़ाइल चुनें","acMove":"दूसरे डिवाइस पर ले जाएँ","acMoved":"अकाउंट फ़ाइल डाउनलोड हुई। इसे दूसरे डिवाइस पर भेजें और वहाँ “मेरा अकाउंट है” दबाएँ।","q5":"दूसरे डिवाइस पर अकाउंट कैसे इस्तेमाल करूँ?","a5":"<li>इस डिवाइस पर <b>दूसरे डिवाइस पर ले जाएँ</b> दबाएँ। <code>follower-account.json</code> डाउनलोड होगी।</li><li>फ़ाइल खुद को भेजें: WhatsApp, ईमेल, AirDrop या Drive। यह एन्क्रिप्टेड है: पासवर्ड के बिना कोई नहीं पढ़ सकता।</li><li>दूसरे डिवाइस पर ऐप खोलें, <b>मेरा अकाउंट है</b> दबाएँ, फ़ाइल चुनें और पासवर्ड लिखें।</li>","a5n":"डिवाइस अपने-आप सिंक नहीं होते: नई Instagram फ़ाइल के बाद ये चरण दोहराएँ।"},"zh":{"acLogin":"我已有账户","acLoginHelp":"选择你的账户文件（follower-account.json），再输入密码。","acPick":"选择账户文件","acMove":"转移到其他设备","acMoved":"账户文件已下载。发到另一台设备，在那里点“我已有账户”。","q5":"如何在其他设备上使用我的账户？","a5":"<li>在这台设备上点<b>转移到其他设备</b>，会下载 <code>follower-account.json</code>。</li><li>把文件发给自己：微信、WhatsApp、邮件、AirDrop 或网盘。文件已加密：没有密码谁也读不了。</li><li>在另一台设备上打开应用，点<b>我已有账户</b>，选择文件并输入密码。</li>","a5n":"设备之间不会自动同步：添加新的 Instagram 文件后，重复以上步骤。"},"ja":{"acLogin":"アカウントを持っている","acLoginHelp":"アカウントファイル（follower-account.json）を選び、パスワードを入力してください。","acPick":"アカウントファイルを選ぶ","acMove":"別の端末へ移す","acMoved":"アカウントファイルをダウンロードしました。別の端末へ送り、そこで「アカウントを持っている」をタップしてください。","q5":"別の端末でアカウントを使うには？","a5":"<li>この端末で<b>別の端末へ移す</b>をタップ。<code>follower-account.json</code> がダウンロードされます。</li><li>そのファイルを自分に送ります：LINE、メール、AirDrop、Driveなど。暗号化されているので、パスワードなしでは読めません。</li><li>別の端末でアプリを開き、<b>アカウントを持っている</b>をタップ。ファイルを選んでパスワードを入力します。</li>","a5n":"端末どうしは自動で同期されません。新しいInstagramファイルを追加したら、この手順を繰り返してください。"},"ko":{"acLogin":"계정이 있어요","acLoginHelp":"계정 파일(follower-account.json)을 고르고 비밀번호를 입력하세요.","acPick":"계정 파일 선택","acMove":"다른 기기로 옮기기","acMoved":"계정 파일을 받았어요. 다른 기기로 보내고 거기서 “계정이 있어요”를 누르세요.","q5":"다른 기기에서 계정을 쓰려면?","a5":"<li>이 기기에서 <b>다른 기기로 옮기기</b>를 누르세요. <code>follower-account.json</code>이 받아져요.</li><li>파일을 나에게 보내세요: 카카오톡, 이메일, AirDrop 또는 Drive. 암호화되어 있어 비밀번호 없이는 못 읽어요.</li><li>다른 기기에서 앱을 열고 <b>계정이 있어요</b>를 눌러 파일을 고르고 비밀번호를 입력하세요.</li>","a5n":"기기끼리 자동 동기화되지 않아요: 새 Instagram 파일을 올린 뒤 이 단계를 반복하세요."},"id":{"acLogin":"Saya punya akun","acLoginHelp":"Pilih file akunmu (follower-account.json) lalu ketik kata sandi.","acPick":"Pilih file akun","acMove":"Pindah ke perangkat lain","acMoved":"File akun diunduh. Kirim ke perangkat lain dan ketuk “Saya punya akun” di sana.","q5":"Bagaimana memakai akun di perangkat lain?","a5":"<li>Di perangkat ini ketuk <b>Pindah ke perangkat lain</b>. Kamu mendapat <code>follower-account.json</code>.</li><li>Kirim file itu ke dirimu: WhatsApp, email, AirDrop atau Drive. Terenkripsi: tak bisa dibaca tanpa kata sandi.</li><li>Di perangkat lain buka aplikasi, ketuk <b>Saya punya akun</b>, pilih file dan ketik kata sandi.</li>","a5n":"Perangkat tidak tersinkron sendiri: setelah file Instagram baru, ulangi langkah ini."}};

const te=new TextEncoder(),b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(h){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(h)));
  acct={...acct,iv:b64(iv),ct:b64(ct)};localStorage.setItem(LOCK,JSON.stringify(acct));
}
async function unseal(pass){
  const k=await derive(pass,unb64(acct.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(acct.iv)},k,unb64(acct.ct));
  return{k,h:sanitize(JSON.parse(new TextDecoder().decode(pt)))};
}

// --- Minimal .zip reader (uses the browser's built-in decompressor, no libraries) ---
async function readZip(buf){
  const v=new DataView(buf),u8=new Uint8Array(buf),out={},td=new TextDecoder();
  let e=buf.byteLength-22;const stop=Math.max(0,e-65557);
  while(e>=stop&&v.getUint32(e,true)!==0x06054b50)e--;
  if(e<stop)throw new Error('zip');
  let p=v.getUint32(e+16,true);const n=v.getUint16(e+10,true);
  for(let i=0;i<n;i++){
    if(v.getUint32(p,true)!==0x02014b50)throw new Error('zip');
    const method=v.getUint16(p+10,true),csize=v.getUint32(p+20,true),usize=v.getUint32(p+24,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),off=v.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(!/(followers|following)[^/]*\.(json|html)$/i.test(name)||usize>MAX_ENTRY)continue;
    const s=off+30+v.getUint16(off+26,true)+v.getUint16(off+28,true),data=u8.subarray(s,s+csize);
    if(method===0)out[name]=td.decode(data);
    else if(method===8)out[name]=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  }
  return out;
}

// --- Extract usernames from Instagram's files (JSON or HTML) ---
function users(text){
  const found=[];
  if(/^\s*[\[{]/.test(text)){
    const walk=o=>{if(Array.isArray(o))return o.forEach(walk);if(o&&typeof o==='object'){
      if(Array.isArray(o.string_list_data)){const d=o.string_list_data[0]||{};found.push(d.value||o.title||String(d.href||'').split('/').filter(Boolean).pop()||'');return}
      Object.values(o).forEach(walk)}};
    walk(JSON.parse(text));
  }else for(const m of text.matchAll(/instagram\.com\/(?:_u\/)?([A-Za-z0-9._]+)/g))found.push(m[1]);
  return clean(found);
}

async function handle(files){
  if(!files.length)return;
  if(locked()){say('needUnlock','red');$('aPassIn').focus();return}
  if(demo){demo=false;mem=acct&&key?mem:null;$('demoBar').classList.add('hidden')}
  const drop=$('drop');drop.classList.add('busy');say('reading');
  try{
    if(typeof DecompressionStream==='undefined'){say('old','red');return}
    const all={};
    for(const f of files){
      if(f.size>MAX_FILE){say('tooBig','red');return}
      if(/\.zip$/i.test(f.name)||f.type.includes('zip'))Object.assign(all,await readZip(await f.arrayBuffer()));
      else all[f.name]=await f.text();
    }
    const fol=new Set(),ing=new Set();
    for(const[name,txt]of Object.entries(all)){
      const base=name.split('/').pop().toLowerCase();
      if(/^followers/.test(base))users(txt).forEach(x=>fol.add(x));
      else if(/^following\./.test(base))users(txt).forEach(x=>ing.add(x));
    }
    if(!fol.size){say('noFol','red');return}
    const h=load(),snap={t:Date.now(),followers:[...fol].sort(),following:[...ing].sort()},last=h[h.length-1];
    if(last&&last.followers.join()===snap.followers.join()&&last.following.join()===snap.following.join()){render();say('sameFile','blue');return}
    h.push(snap);save(h);
    render();say('saved','green',{n:nf(fol.size)});
    $('results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }catch{say('readErr','red')}
  finally{drop.classList.remove('busy')}
}

$('exp').addEventListener('click',async()=>{const h=load();if((!h.length&&!acct)||demo){say('nothing','red');return}
  await chain;const txt=JSON.stringify(acct?{v:1,name:acct.name,salt:acct.salt,iv:acct.iv,ct:acct.ct}:h);
  if(embedded){try{await navigator.clipboard.writeText(txt);say('copied','green')}catch{say('copyFail','red')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=acct?'follower-account.json':'follower-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('impLabel').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();$('imp').click()}});
$('imp').addEventListener('change',async ev=>{
  try{const raw=JSON.parse(await ev.target.files[0].text());
    // Encrypted backup from an account: keep it locked until the password is typed
    if(isLock(raw)){acct={v:1,name:String(raw.name||'').slice(0,40),salt:raw.salt,iv:raw.iv,ct:raw.ct};key=null;mem=null;demo=false;$('demoBar').classList.add('hidden');
      localStorage.setItem(LOCK,JSON.stringify(acct));try{localStorage.removeItem(KEY)}catch{}render();say('encLoaded','blue');$('aLoginBox').classList.add('hidden');$('acct').scrollIntoView({block:'center'});$('aPassIn').focus();return}
    if(locked()){say('needUnlock','red');return}
    if(!Array.isArray(raw))throw 0;
    const h=sanitize(raw);
    if(!h.length)throw 0;demo=false;$('demoBar').classList.add('hidden');save(h);render();
    if(fromLogin&&!acct){$('aLoginBox').classList.add('hidden');$('aNew').classList.remove('hidden');$('aOpen').setAttribute('aria-expanded','true');$('aLogin').setAttribute('aria-expanded','false');$('acct').scrollIntoView({block:'center'});$('aName').focus();say('plainToAcct','blue')}
    else say('loaded','green')}
  catch{say('bad','red')}finally{ev.target.value='';fromLogin=false}});
// Account events (forms never submit anywhere: handled here)
// Only one panel open at a time: create account or sign in
const panel=(show,hide,btn,other)=>{const o=$(show).classList.toggle('hidden');$(hide).classList.add('hidden');$(btn).setAttribute('aria-expanded',String(!o));$(other).setAttribute('aria-expanded','false');return!o};
$('aOpen').addEventListener('click',()=>{if(panel('aNew','aLoginBox','aOpen','aLogin'))$('aName').focus()});
$('aLogin').addEventListener('click',()=>{if(panel('aLoginBox','aNew','aLogin','aOpen'))$('aPick').focus()});
// No server: signing in on a device means opening your encrypted backup, then typing its password
let fromLogin=false;
$('aPick').addEventListener('click',()=>{fromLogin=true;$('imp').click()});
$('impLabel').addEventListener('click',()=>{fromLogin=false});
$('syncLink').addEventListener('click',()=>{$('sync').open=true});
$('aNew').addEventListener('submit',async ev=>{ev.preventDefault();
  const name=$('aName').value.trim().slice(0,40),p1=$('aPass').value,p2=$('aPass2').value;
  if(!name){say('acNeedName','red');$('aName').focus();return}
  if(p1.length<6){say('acShort','red');$('aPass').focus();return}
  if(p1!==p2){say('acMismatch','red');$('aPass2').focus();return}
  const b=ev.submitter||ev.target.querySelector('button');b.disabled=true;
  try{const salt=crypto.getRandomValues(new Uint8Array(16)),h=load();key=await derive(p1,salt);acct={v:1,name,salt:b64(salt)};await seal(h);mem=h;
    try{localStorage.removeItem(KEY)}catch{}ev.target.reset();render();say('acMade','green')}
  catch{acct=null;key=null;say('acStore','red')}finally{b.disabled=false}});
$('aLock').addEventListener('submit',async ev=>{ev.preventDefault();const b=ev.submitter,pi=$('aPassIn');if(!pi.value)return;if(b)b.disabled=true;
  try{const r=await unseal(pi.value);key=r.k;mem=r.h;pi.value='';render();say('acWelcome','green')}
  catch{say('acWrong','red');pi.select()}finally{if(b)b.disabled=false}});
$('aMove').addEventListener('click',()=>{$('exp').click();say('acMoved','green')});
$('aOut').addEventListener('click',async()=>{await chain;key=null;mem=null;render();say('acBye','blue')});
$('aRemove').addEventListener('click',async()=>{await chain;const h=load();try{localStorage.setItem(KEY,JSON.stringify(h));localStorage.removeItem(LOCK)}catch{say('acStore','red');return}
  acct=null;key=null;mem=null;render();say('acRemoved','green')});
// Forgotten password: there is no way to recover it, so the only way out is a clean start (two taps)
$('aForgot').addEventListener('click',ev=>{const b=ev.currentTarget;
  if(!b.dataset.sure){b.dataset.sure=1;b.textContent=t('acSure');setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent=t('acForgot')}},4000);return}
  delete b.dataset.sure;try{localStorage.removeItem(LOCK);localStorage.removeItem(KEY)}catch{}acct=null;key=null;mem=null;render();say('acReset','blue')});
// Copy a list (only what is shown with the current search)
document.addEventListener('click',async ev=>{const b=ev.target.closest('.cp');if(!b)return;const s=LISTS[b.dataset.l];if(!s)return;
  const q=query(),arr=q?s.arr.filter(u=>u.includes(q)):s.arr;if(!arr.length){say('nothing','red');return}
  try{await navigator.clipboard.writeText(arr.map(u=>'@'+u).join('\n'));say('copiedList','green',{n:nf(arr.length)})}catch{say('copyFail','red')}});
const sel=$('langSel');
for(const[code,d]of Object.entries(I18N)){const o=document.createElement('option');o.value=code;o.textContent=d._n;sel.append(o)}
sel.addEventListener('change',()=>{try{localStorage.setItem(LKEY,sel.value)}catch{}applyLang(sel.value);say('')});
const hashLang=/^#demo-?([a-z]{2})?$/.exec(location.hash);
if(hashLang)loadDemo();
applyLang(hashLang&&hashLang[1]&&I18N[hashLang[1]]?hashLang[1]:pickLang());
</script>
</body>
</html>
